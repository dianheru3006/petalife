<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="mochiBg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#FFEFE8"/>
    </radialGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8D5BA"/>
      <stop offset="100%" stop-color="#66BB6A"/>
    </linearGradient>
    <filter id="cozyGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#E27344" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Cozy Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#mochiBg)" stroke="#FED7C5" stroke-width="3" filter="url(#cozyGlow)"/>

  <!-- Sprout Stem & Leaf -->
  <path d="M50 32 C50 20 44 14 36 17 C34 23 42 27 49 28" fill="url(#sproutGrad)"/>
  <path d="M50 32 C51 22 58 16 65 19 C66 25 58 28 51 29" fill="url(#sproutGrad)"/>
  <circle cx="50" cy="30" r="2.5" fill="#66BB6A"/>

  <!-- Mochi Body -->
  <ellipse cx="50" cy="56" rx="31" ry="25" fill="#FFFFFF" stroke="#EAE4DC" stroke-width="2"/>

  <!-- Eyes -->
  <ellipse cx="40" cy="52" rx="3.2" ry="4.2" fill="#2E2E3A"/>
  <circle cx="38.8" cy="50.2" r="1.3" fill="#FFFFFF"/>

  <ellipse cx="60" cy="52" rx="3.2" ry="4.2" fill="#2E2E3A"/>
  <circle cx="58.8" cy="50.2" r="1.3" fill="#FFFFFF"/>

  <!-- Cheeks -->
  <ellipse cx="32" cy="58" rx="4.5" ry="2.8" fill="#F4A261" opacity="0.55"/>
  <ellipse cx="68" cy="58" rx="4.5" ry="2.8" fill="#F4A261" opacity="0.55"/>

  <!-- Happy Smile -->
  <path d="M46 58 Q50 63 54 58" fill="none" stroke="#2E2E3A" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Tiny Paw Sparkle -->
  <circle cx="50" cy="73" r="3" fill="#FFE3D6"/>
  <circle cx="43" cy="71" r="2.2" fill="#FFE3D6"/>
  <circle cx="57" cy="71" r="2.2" fill="#FFE3D6"/>
</svg>