<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="mochiBg512" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#FFEFE8"/>
    </radialGradient>
    <linearGradient id="sproutGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8D5BA"/>
      <stop offset="100%" stop-color="#66BB6A"/>
    </linearGradient>
    <filter id="cozyGlow512" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#E27344" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Cozy Circle -->
  <circle cx="256" cy="256" r="236" fill="url(#mochiBg512)" stroke="#FED7C5" stroke-width="14" filter="url(#cozyGlow512)"/>

