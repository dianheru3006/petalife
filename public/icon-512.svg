  <path d="M256 160 C256 100 224 70 186 85 C176 117 218 139 250 144" fill="url(#sproutGrad512)"/>
  <path d="M256 160 C262 112 300 80 336 96 C342 128 300 144 262 150" fill="url(#sproutGrad512)"/>
  <circle cx="256" cy="150" r="12" fill="#66BB6A"/>

  <!-- Mochi Body -->
  <ellipse cx="256" cy="290" rx="160" ry="128" fill="#FFFFFF" stroke="#EAE4DC" stroke-width="10"/>

  <!-- Eyes -->
  <ellipse cx="204" cy="268" rx="16" ry="21" fill="#2E2E3A"/>
  <circle cx="197" cy="260" r="6.5" fill="#FFFFFF"/>

  <ellipse cx="308" cy="268" rx="16" ry="21" fill="#2E2E3A"/>
  <circle cx="301" cy="260" r="6.5" fill="#FFFFFF"/>

  <!-- Cheeks -->
  <ellipse cx="166" cy="300" rx="23" ry="14" fill="#F4A261" opacity="0.55"/>
  <ellipse cx="346" cy="300" rx="23" ry="14" fill="#F4A261" opacity="0.55"/>

  <!-- Smile -->
  <path d="M234 300 Q256 326 278 300" fill="none" stroke="#2E2E3A" stroke-width="10" stroke-linecap="round"/>

  <!-- Little paws -->
