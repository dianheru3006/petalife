<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.json" />
    <!-- R3-PERF-01: latar ruang Mochi adalah gambar terbesar di layar pertama. -->
    <link rel="preload" as="image" type="image/webp" href="./src/assets/room-bg.webp" />
    <meta name="application-name" content="Petalife" />
    <meta name="theme-color" content="#FAF6EE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Petalife" />
    <meta name="description" content="A cozy Tamagotchi-inspired virtual companion that helps you capture, review, and retain your learning materials." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Telegram Mini App Official SDK.
         R3-PERF-02: WAJIB defer. Skrip klasik sinkron di <head> memblokir first paint
         sampai telegram.org menjawab; di jaringan buruk itu = layar putih.
         Urutan eksekusi tetap benar: defer dieksekusi sebelum modul React (juga deferred). -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Petalife — Cozy Virtual Pet & Learning Vault</title>
    <!-- R5-PERF-01: tipografi self-hosted (2 file variabel, 66 KB) menggantikan
         10 face statis dari Google Fonts (332 KB) + 2 koneksi pihak ketiga.
         Preload agar swap font selesai sebelum React commit, bukan sesudahnya.
         Vite menulis ulang href ini menjadi aset ber-hash saat build. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./src/assets/fonts/plus-jakarta-sans-latin-variable.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./src/assets/fonts/nunito-latin-variable.woff2" />
    <style>
      /* R5-PERF-02: boot frame. Di WebView Telegram, pengguna melihat kanvas krem
         kosong selama JS utama diunduh + diparse + React mount. Frame statis ini
         dicat pada paint pertama (~30-50 ms) dengan geometri header, kartu diorama,
         dan bottom nav yang identik, memakai font sistem sehingga nol byte font.
         React mengambil alih di #root; frame disembunyikan murni oleh CSS selector
         di bawah, tanpa JS, tanpa layout shift, tanpa perubahan desain. */
      #boot-frame {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        flex-direction: column;
        background: #FDFBF7;
        pointer-events: none;
        overflow: hidden;
      }
      /* Lepas instan, bukan fade. Transisi opacity/visibility bisa tertahan di
         WebView yang sedang throttled (frame transisi tidak berjalan), dan
         overlay yang tertinggal akan menutupi aplikasi walau klik tetap lolos.
         Karena geometrinya identik, pertukaran tanpa animasi tidak terlihat. */
      #root:not(:empty) ~ #boot-frame {
        display: none;
      }
      .bf-wrap {
        width: 100%;
        max-width: 28rem;
        margin: 0 auto;
        padding: 14px;
      }
      .bf-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 44px;
        padding: 0 8px;
      }
      .bf-lines { display: flex; flex-direction: column; gap: 7px; }
      .bf-bar { display: block; border-radius: 8px; background: #E7E1D6; }
      .bf-bar-greet { width: 68px; height: 11px; }
      .bf-bar-title { width: 142px; height: 22px; background: #E0D8CB; }
      .bf-pills { display: flex; gap: 8px; }
      .bf-pill {
        display: block;
        height: 30px;
        border-radius: 999px;
        background: #F4EFE6;
        border: 1px solid #EAE3D5;
      }
      .bf-pill-wide { width: 88px; }
      .bf-pill-narrow { width: 56px; }
      .bf-stage {
        /* 16px space-y-4 + 5px beda baseline header nyata (diukur dari DOM
           PetRoom pada viewport 439px): kartu frame dan kartu asli mendarat
           di y yang sama sehingga tidak ada lompatan saat React mengambil alih. */
        margin-top: 21px;
        width: 100%;
        aspect-ratio: 9 / 13;
        max-height: 560px;
        border-radius: 32px;
        border: 2px solid #E8DFCF;
        background: #EEE1CD;
      }
      .bf-nav {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(1.35rem + var(--tg-content-safe-area-inset-bottom, var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))));
        width: calc(100% - 1.75rem);
        max-width: 348px;
        height: 66px;
        border-radius: 999px;
        background: rgba(250, 247, 242, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 16px 40px rgba(46, 46, 58, 0.12), 0 2px 8px rgba(0, 0, 0, 0.04);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
      }
      .bf-dot {
        display: block;
        width: 36px;
        height: 36px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.045);
      }
      .bf-dot-active { width: 76px; background: #EDE7DC; }
    </style>
    <!-- Defensive cleanup for dev environments: immediately unregister any stale production Service Workers -->
    <script>
      if ('serviceWorker' in navigator && (
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1' ||
        window.location.port === '5173' ||
        window.location.hostname.startsWith('192.168.') ||
        window.location.hostname.startsWith('10.') ||
        window.location.hostname.startsWith('100.')
      )) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) r.unregister();
        });
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var k of keys) caches.delete(k);
          });
        }
      }
    </script>
  </head>
  <body class="bg-[#FDFBF7] text-[#2E2E3A] antialiased selection:bg-[#FED7C5] selection:text-[#2E2E3A] min-h-screen">
    <div id="root"></div>
    <!-- R5-PERF-02: frame yang terlihat sebelum React mount. Bentuknya sengaja
         netral (header + kartu besar + nav) karena Beranda, Pustaka, dan Catatan
         semuanya dibuka dengan header pendek + satu kartu diorama besar. -->
    <div id="boot-frame" aria-hidden="true">
      <div class="bf-wrap">
        <div class="bf-head">
          <div class="bf-lines">
            <span class="bf-bar bf-bar-greet"></span>
            <span class="bf-bar bf-bar-title"></span>
          </div>
          <div class="bf-pills">
            <span class="bf-pill bf-pill-wide"></span>
            <span class="bf-pill bf-pill-narrow"></span>
          </div>
        </div>
        <div class="bf-stage"></div>
      </div>
      <div class="bf-nav">
        <span class="bf-dot bf-dot-active"></span>
        <span class="bf-dot"></span>
        <span class="bf-dot"></span>
        <span class="bf-dot"></span>
        <span class="bf-dot"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
